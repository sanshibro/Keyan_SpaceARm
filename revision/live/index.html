<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文修改与仿真观察</title>
<style>body{margin:24px auto;max-width:1320px;padding:0 20px;font:16px/1.65 system-ui;color:#202a31;background:#f6f7f8}h1{font-size:25px;margin-bottom:4px}h2{font-size:19px}small{color:#55646c}section{background:white;border:1px solid #d9dfe4;padding:20px;margin:16px 0}progress{width:100%;height:12px;accent-color:#286783}img{max-width:100%;display:block}button,a{color:#245b7b}button{padding:6px 16px;margin:6px;background:white;border:1px solid #aab8c1;cursor:pointer}input{width:75%}.row{display:flex;gap:24px;flex-wrap:wrap}.row>*{flex:1;min-width:360px}canvas{width:100%;background:#fff}#stale{color:#9c532b}.tag{color:#286783;font-weight:600}figure{margin:0}figcaption{font-size:14px;color:#52616c}</style>
<h1>论文修改与仿真观察</h1><small>分支：<span id="branch"></span> · 此页面每 5 秒检查阶段状态</small>
<section><span class="tag" id="mode"></span><h2 id="stage">正在连接 NUC…</h2><p id="detail"></p><progress id="progress" max="100" value="0"></progress><p id="items"></p><small id="updated"></small> <small id="stale"></small></section>
<section id="replayPanel" hidden><h2>原始三门任务：记录状态回放</h2><p>从已保存的实际状态重放；用于检查原图选帧与穿门机制。新物理实验会单独显示。</p><canvas id="replay" width="1200" height="380"></canvas><button id="play">播放</button><input id="seek" type="range" min="0" value="0"><span id="time"></span></section>
<section><h2>当前图形预览</h2><div class="row"><figure><img id="geometry" alt="几何机制图：生成后自动显示"><figcaption>几何必要性与净空</figcaption></figure><figure><img id="rolling" alt="滚动执行图：生成后自动显示"><figcaption>窗口接续、指令与实际状态</figcaption></figure></div></section>
<section id="physicsPanel" hidden><h2>MuJoCo 当前运行</h2><img id="physics" alt="物理仿真观察画面"><p id="physicsInfo"></p></section>
<section><h2>论文预览</h2><p><a href="paper_preview.pdf" target="_blank">阶段全文 PDF</a>　<a href="focused_preview.pdf" target="_blank">两张图所在页 PDF</a></p><p id="commits"></p></section>
<script>
let data=null,idx=0,playing=false,lastData=0;
const $=id=>document.getElementById(id);
async function refresh(){try{let s=await(await fetch('status.json?t='+Date.now())).json();for(let k of ['stage','detail','mode','branch'])$(k).textContent=s[k]||'';$('progress').value=s.progress||0;$('items').textContent=(s.items||[]).join(' · ');$('updated').textContent='阶段更新时间：'+new Date(s.updated).toLocaleString();$('stale').textContent=Date.now()-Date.parse(s.updated)>300000?'本阶段已超过 5 分钟；请结合下方画面和最新说明判断进度。':'';$('commits').textContent=(s.commits||[]).join(' | ');for(let [id,url] of [['geometry',s.geometry],['rolling',s.rolling]])if(url&&$(id).dataset.url!==url){$(id).src=url+'?v='+s.updated;$(id).dataset.url=url}if(s.physics){$('physicsPanel').hidden=false;$('physics').src=s.physics+'?t='+Date.now();$('physicsInfo').textContent=s.physics_detail||''}if(!data&&s.replay){data=await(await fetch(s.replay)).json();$('replayPanel').hidden=false;$('seek').max=data.frames.length-1;draw()}}catch(e){$('detail').textContent='连接暂不可用：'+e.message}}
function draw(){if(!data)return;let c=$('replay'),x=c.getContext('2d'),f=data.frames[idx],sx=v=>80+v/10.5*1060,sy=v=>335-v/2.65*290;x.clearRect(0,0,c.width,c.height);x.font='17px Georgia';x.fillStyle='#555';x.fillText('World z (m)',8,30);x.fillText('Forward progress (m)',950,372);for(let g of data.gates){x.fillStyle='#e3e5e6';x.fillRect(sx(g.s-.12),sy(g.lower),24,sy(0)-sy(g.lower));x.fillRect(sx(g.s-.12),sy(2.6),24,sy(g.upper)-sy(2.6));x.fillStyle='#333';x.fillText(g.name,sx(g.s)-12,25)}x.strokeStyle='#b7c6ce';x.lineWidth=2;x.beginPath();data.frames.forEach((p,i)=>{let q=[sx(p.s),sy(p.z)];i?x.lineTo(...q):x.moveTo(...q)});x.stroke();let px=sx(f.s),py=sy(f.z);x.fillStyle='#316d8d';x.fillRect(px-25,py-6,50,12);x.strokeStyle='#212b32';x.lineWidth=7;x.beginPath();f.arm.forEach((a,i)=>i?x.lineTo(sx(a[0]),sy(a[1])):x.moveTo(sx(a[0]),sy(a[1])));x.stroke();x.fillStyle='#202a31';x.fillText('t = '+f.t.toFixed(2)+' s   θ = '+f.theta.toFixed(1)+'°',80,32);$('seek').value=idx;$('time').textContent=f.t.toFixed(1)+' s'}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('seek').oninput=e=>{idx=+e.target.value;draw()};setInterval(()=>{if(playing&&data){idx=(idx+1)%data.frames.length;draw()}},100);refresh();setInterval(refresh,5000);
</script><script src="usage.js"></script></html>
